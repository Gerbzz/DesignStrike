name: DesignStrike bounded publication proof

on:
  push:
    branches: [feature/designstrike-publication-proof]
    paths-ignore: ["docs/**", "README.md", "ASSETS.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
      LIBGL_ALWAYS_SOFTWARE: "1"
      WGPU_BACKEND: "gl"
    steps:
      - uses: actions/checkout@v4
      - name: Confirm environment and source identity
        run: |
          rustc --version
          df -h /
          test ! -e docs/brand
          test -s assets/branding/PWDS-logo.png
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Test wrap-triggered primary story reflow
        run: cargo test --locked --profile smoke -p designcraft-engine wrapping_object_reflows_primary_story_onto_a_new_page
      - name: Install native display and PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libxkbcommon-x11-0 libgl1 libegl1 mesa-vulkan-drivers poppler-utils
      - name: Build complete desktop and CLI binaries
        run: cargo build --locked --profile smoke -p designcraft -p designcraft-cli
      - name: Test independent product links
        run: cargo test --locked --profile smoke -p designcraft-engine project_links_are_owned_by_the_fork
      - name: Test page deletion and inside-bleed regressions
        run: |
          mkdir -p "$RUNNER_TEMP/designstrike-evidence"
          set +e
          cargo test --locked --profile smoke -p designcraft-engine explicitly_deleted_primary_story_ 2>&1 | tee "$RUNNER_TEMP/designstrike-evidence/regression-tests.log"
          reflow_status=${PIPESTATUS[0]}
          cargo test --locked --profile smoke -p designcraft-engine new_facing_page_does_not_inherit_previous_pages_inside_bleed_artwork 2>&1 | tee -a "$RUNNER_TEMP/designstrike-evidence/regression-tests.log"
          bleed_status=${PIPESTATUS[0]}
          test "$reflow_status" -eq 0 && test "$bleed_status" -eq 0
      - name: Run engine and renderer library suites
        run: |
          cargo test --locked --profile smoke -p designcraft-engine --lib
          cargo test --locked --profile smoke -p designcraft-render --lib
      - name: Drive native application and save a multi-page document
        run: xvfb-run -a -s "-screen 0 1440x900x24" bash scripts/ci_designstrike_native.sh target/smoke/designcraft "$RUNNER_TEMP/designstrike-evidence"
      - name: Reopen and export the actual publication
        run: python3 scripts/ci_designstrike_publication.py target/smoke/designcraft-cli "$RUNNER_TEMP/designstrike-evidence"
      - name: Save bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: designstrike-publication-evidence
          path: |
            ${{ runner.temp }}/designstrike-evidence/welcome.png
            ${{ runner.temp }}/designstrike-evidence/about.png
            ${{ runner.temp }}/designstrike-evidence/editor.png
            ${{ runner.temp }}/designstrike-evidence/edited-page.png
            ${{ runner.temp }}/designstrike-evidence/pages/page-*.png
            ${{ runner.temp }}/designstrike-evidence/pdf-pages/pdf-*.png
            ${{ runner.temp }}/designstrike-evidence/publication.pdf
            ${{ runner.temp }}/designstrike-evidence/native-inspect.json
            ${{ runner.temp }}/designstrike-evidence/reopened-inspect.json
            ${{ runner.temp }}/designstrike-evidence/idml-inspect.json
            ${{ runner.temp }}/designstrike-evidence/verification.json
            ${{ runner.temp }}/designstrike-evidence/desktop.log
            ${{ runner.temp }}/designstrike-evidence/cli.log
            ${{ runner.temp }}/designstrike-evidence/regression-tests.log
          if-no-files-found: ignore
          retention-days: 1
